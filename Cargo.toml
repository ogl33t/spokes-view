[package]
name = "spokes-view"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "spokes-view: a read-only radial web view of a Spokes to-do tree"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
# rustls only (no OpenSSL); no redirects, gzip passed through undecoded.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
# Embeds web/dist into the release binary.
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
